name: Promo Content Pipeline

on:
  push:
    paths:
      - 'queue/0_stok_link/**'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Downloader (Divisi 1)
        run: python src/divisi_1_pengunduh/shopee_downloader.py || exit 0

      # ---- SET UP REMOTION (NODE.JS) ----
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Chromium for Remotion
        run: npx remotion browser ensure

      - name: Run Remotion Render (Divisi 2)
        run: node render.js || exit 0

      - name: Commit and push changes back
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add output/ queue/
          git commit -m "Auto-render Remotion promo video" || echo "No changes to commit"
          git push
